name: dependabot-commit
on:
  workflow_run:
    workflows: [dependabot-build]
    types:
      - completed

permissions:
  contents: write

jobs:
  dependabot-commit:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor == 'dependabot[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ github.token }}

      - name: Download build diff
        uses: actions/download-artifact@v8
        with:
          name: dependabot-build-${{ github.event.workflow_run.id }}
          path: /tmp

      - name: Apply diff
        id: apply
        run: |
          if [ -s /tmp/changes.patch ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git apply /tmp/changes.patch
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Git commit and push
        if: steps.apply.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "feat(lib): generate code from braze-specification"
          add_options: "-A"
          file_pattern: "*.php"
